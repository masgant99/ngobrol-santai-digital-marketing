<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ngobrol Santai Digital Marketing - SMP Kelas 2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4F46E5;
      --primary-light: #818CF8;
      --accent: #F59E0B;
      --accent-pink: #EC4899;
      --bg: #0F172A;
      --card-bg: rgba(30, 41, 59, 0.75);
      --card-border: rgba(255, 255, 255, 0.12);
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      user-select: none;
    }

    body {
      background: var(--bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(79, 70, 229, 0.25) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(236, 72, 153, 0.2) 0px, transparent 50%),
        radial-gradient(at 50% 50%, rgba(15, 23, 42, 1) 0px, transparent 100%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow-x: hidden;
    }

    header {
      padding: 18px 36px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      background: rgba(15, 23, 42, 0.6);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      font-size: 1.2rem;
      letter-spacing: -0.5px;
    }

    .brand-badge {
      background: linear-gradient(135deg, #6366F1, #EC4899);
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .status-sync {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
      color: #34D399;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.25);
      padding: 5px 12px;
      border-radius: 20px;
    }

    .sync-dot {
      width: 8px;
      height: 8px;
      background: #10B981;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 36px;
      position: relative;
    }

    .slide-wrapper {
      width: 100%;
      max-width: 1080px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 40px 48px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(20px);
      transition: all 0.3s ease;
      position: relative;
      min-height: 500px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .slide-tag {
      display: inline-block;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--primary-light);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 8px;
    }

    .slide-title {
      font-size: 2.5rem;
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #FFFFFF 40%, #CBD5E1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .slide-subtitle {
      font-size: 1.15rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .hero-content {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 20px;
    }

    .hero-item {
      font-size: 1.2rem;
      font-weight: 600;
      color: #E2E8F0;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 16px 20px;
      border-radius: 14px;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin-bottom: 20px;
    }

    .card-item {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 22px 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: transform 0.2s, border-color 0.2s;
    }

    .card-item:hover {
      transform: translateY(-4px);
      border-color: rgba(99, 102, 241, 0.4);
    }

    .card-icon {
      font-size: 2rem;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #FFFFFF;
    }

    .card-desc {
      font-size: 0.92rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .steps-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    .step-item {
      display: flex;
      align-items: center;
      gap: 18px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 14px 20px;
      border-radius: 16px;
    }

    .step-num {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: linear-gradient(135deg, #4F46E5, #06B6D4);
      color: #fff;
      font-weight: 800;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .step-details {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .step-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #F8FAFC;
    }

    .step-desc {
      font-size: 0.92rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .comparison-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    .comparison-col {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .comparison-col.highlight {
      background: rgba(79, 70, 229, 0.12);
      border-color: rgba(99, 102, 241, 0.4);
    }

    .comp-title {
      font-size: 1.15rem;
      font-weight: 700;
    }

    .comp-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 0.95rem;
      color: #CBD5E1;
      line-height: 1.5;
    }

    .comp-bullet {
      color: var(--accent);
      font-size: 1.1rem;
      line-height: 1;
    }

    .slide-footer-tip {
      background: rgba(245, 158, 11, 0.1);
      border: 1px dashed rgba(245, 158, 11, 0.35);
      padding: 12px 18px;
      border-radius: 12px;
      font-size: 0.92rem;
      color: #FDE68A;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: auto;
    }

    footer {
      padding: 16px 36px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(12px);
    }

    .slide-counter {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    .slide-counter span {
      color: #FFFFFF;
      font-size: 1.3rem;
    }

    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .btn {
      background: rgba(255, 255, 255, 0.08);
      color: #FFF;
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 9px 18px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.18);
      border-color: rgba(255, 255, 255, 0.3);
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn-primary {
      background: linear-gradient(135deg, #4F46E5, #6366F1);
      border: none;
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.4);
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #4338CA, #4F46E5);
    }

    .progress-bar-container {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #4F46E5, #EC4899);
      width: 10%;
      transition: width 0.3s ease;
    }

    .key-hint {
      font-size: 0.85rem;
      color: var(--text-muted);
    }
  </style>
</head>

      {

      {

        "type": "cards",
        "cards": [
          {"icon": "🔒", "title": "Rahasiakan Privasi", "desc": "JANGAN PERNAH sebar alamat rumah, nomor HP pribadi, nama lengkap ortu, atau lokasi real-time."},
          {"icon": "🤝", "title": "Jauhi Cyberbullying", "desc": "Gunakan kolom komentar untuk saling dukung, bukan menghujat atau sebar kebencian."},
          {"icon": "⚖️", "title": "Bagi Waktu dengan Bijak", "desc": "Tugas utama tetap belajar dan istirahat. Medsos adalah alat berkarya, bukan penghabis waktu."}
        ],

      },
      {
        "id": 9,
        "tag": "PENUTUP & TANYA JAWAB",
        "title": "Waktunya Ngobrol Santai! 💬",
        "subtitle": "Ada yang punya ide mau bikin konten apa minggu ini?",
        "type": "hero",
        "points": [
          "✨ 'Jangan cuma jadi penonton algoritma orang lain...'",
          "🚀 '...jadilah kreator yang membawa inspirasi dan kebaikan!'",
          "👏 Terima kasih teman-teman kelas 8 semuanya!"
        ],
        "footer_tip": "Yuk tanyakan apa saja seputar digital marketing, konten, atau medsos!"
      }
    ];

    let currentSlide = 1;
    const totalSlides = slides.length;

    function renderSlide(index) {
      const slide = slides[index - 1];
      const box = document.getElementById('slideBox');
      let bodyHtml = '';

      if (slide.type === 'hero') {
        bodyHtml = `
          <div class="hero-content">
            ${slide.points.map(p => `<div class="hero-item">${p}</div>`).join('')}
          </div>
        `;
      } else if (slide.type === 'cards') {
        bodyHtml = `
          <div class="cards-grid">
            ${slide.cards.map(c => `
              <div class="card-item">
                <div class="card-icon">${c.icon}</div>
                <div class="card-title">${c.title}</div>
                <div class="card-desc">${c.desc}</div>
              </div>
            `).join('')}
          </div>
        `;
      } else if (slide.type === 'comparison') {
        bodyHtml = `
          <div class="comparison-grid">
            <div class="comparison-col">
              <div class="comp-title">${slide.left.title}</div>
              ${slide.left.items.map(item => `
                <div class="comp-item"><span class="comp-bullet">•</span> <span>${item}</span></div>
              `).join('')}
            </div>
            <div class="comparison-col highlight">
              <div class="comp-title" style="color: #818CF8;">${slide.right.title}</div>
              ${slide.right.items.map(item => `
                <div class="comp-item"><span class="comp-bullet" style="color:#10B981;">✓</span> <span>${item}</span></div>
              `).join('')}
            </div>
          </div>
        `;
      } else if (slide.type === 'steps') {
        bodyHtml = `
          <div class="steps-list">
            ${slide.steps.map(s => `
              <div class="step-item">
                <div class="step-num">${s.num}</div>
                <div class="step-details">
                  <div class="step-title">${s.title}</div>
                  <div class="step-desc">${s.desc}</div>
                </div>
              </div>
            `).join('')}
          </div>
        `;
      }

      box.innerHTML = `
        <div>
          <span class="slide-tag">${slide.tag}</span>
          <h1 class="slide-title" id="renderedTitle">${slide.title}</h1>
          <p class="slide-subtitle">${slide.subtitle}</p>
          ${bodyHtml}
        </div>
        <div class="slide-footer-tip">
          <span>💡</span>
          <span>${slide.footer_tip}</span>
        </div>
      `;

      document.getElementById('currentNum').textContent = currentSlide;
      document.getElementById('totalNum').textContent = totalSlides;
      const pct = (currentSlide / totalSlides) * 100;
      document.getElementById('progressBar').style.width = pct + '%';
      document.getElementById('prevBtn').disabled = (currentSlide <= 1);
      document.getElementById('nextBtn').disabled = (currentSlide >= totalSlides);
    }

    function nextSlide() {
      if (currentSlide < totalSlides) {
        currentSlide++;
        renderSlide(currentSlide);
      }
    }

    function prevSlide() {
      if (currentSlide > 1) {
        currentSlide--;
        renderSlide(currentSlide);
      }
    }

    function goToSlide(n) {
      if (n >= 1 && n <= totalSlides) {
        currentSlide = n;
        renderSlide(currentSlide);
      }
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') nextSlide();
      if (e.key === 'ArrowLeft' || e.key === 'PageUp') prevSlide();
    });

    // Remote Realtime Listener (SSE via ntfy.sh)
    const REMOTE_CHANNEL = "bejo-slide-ctrl-didik";
    function setupRemoteListener() {
      const eventSource = new EventSource(`https://ntfy.sh/${REMOTE_CHANNEL}/sse`);
      eventSource.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data && data.message) {
            const cmd = data.message.trim().toLowerCase();
            if (cmd === 'next') nextSlide();
            else if (cmd === 'prev') prevSlide();
            else if (cmd.startsWith('goto:')) {
              const num = parseInt(cmd.replace('goto:', ''));
              if (!isNaN(num)) goToSlide(num);
            }
          }
        } catch (e) {
          console.error(e);
        }
      };
      eventSource.onerror = () => {
        document.getElementById('syncText').textContent = 'Menghubungkan ulang...';
      };
      eventSource.onopen = () => {
        document.getElementById('syncText').textContent = 'Terkoneksi ke BEJO Remote';
      };
    }

    renderSlide(currentSlide);
    setupRemoteListener();
  </script>
</body>
</html>
